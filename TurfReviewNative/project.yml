name: TurfReviewNative
options:
  bundleIdPrefix: com.jamesheffernan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 7W38KL8969
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 202609231800
    MARKETING_VERSION: 1.3.0
    SWIFT_VERSION: 5.0
    TURF_DEFAULT_SERVER_URL: https://review.turfterrace.com
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
targets:
  TurfReviewNative:
    type: application
    platform: iOS
    productName: Turf Review
    deploymentTarget: "17.0"
    sources:
      - path: TurfReviewNative
        excludes:
          - Resources/Info.plist
          - Resources/Info-macOS.plist
          - Resources/TurfReviewMac.entitlements
          - Resources/TurfReview.entitlements
    resources:
      - path: TurfReviewNative/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesheffernan.turfreviewnative
        PRODUCT_MODULE_NAME: TurfReviewNative
        PRODUCT_NAME: Turf Review
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: TurfReviewNative/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TurfReviewNative/Resources/TurfReview.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  TurfReviewNativeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TurfReviewNativeTests
    dependencies:
      - target: TurfReviewNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesheffernan.turfreviewnative.tests
  TurfReviewMac:
    type: application
    platform: macOS
    productName: TurfReviewMac
    deploymentTarget: "14.0"
    sources:
      - path: TurfReviewNative
        excludes:
          - Resources/Info.plist
          - Resources/Info-macOS.plist
          - Resources/TurfReviewMac.entitlements
          - Resources/TurfReview.entitlements
    resources:
      - path: TurfReviewNative/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesheffernan.turfreviewmac
        PRODUCT_MODULE_NAME: TurfReviewMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: TurfReviewNative/Resources/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: TurfReviewNative/Resources/TurfReviewMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  TurfReviewMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TurfReviewNativeTests
    dependencies:
      - target: TurfReviewMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesheffernan.turfreviewmac.tests
schemes:
  TurfReviewNative:
    build:
      targets:
        TurfReviewNative: all
        TurfReviewNativeTests: [test]
    test:
      targets:
        - TurfReviewNativeTests
    run:
      config: Debug
  TurfReviewMac:
    build:
      targets:
        TurfReviewMac: all
        TurfReviewMacTests: [test]
    test:
      targets:
        - TurfReviewMacTests
    run:
      config: Debug
